<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SoullessRP radio player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
/* SoullessRP radio player (version 2).
   The game opens this page in a hidden browser panel (never shown) and drives it with these functions:
     setTrack(videoId, startSeconds)   play that YouTube video from that second (audio is all anybody hears)
     setVol(0-100)                     the volume for this player
     stopTrack()                       stop
     report()                          write the player's state to the console (the game's  soul_radio_status  command shows it)
   and the page tells the game (inside Garry's Mod) with  radio.dur(seconds)  (0 = live stream), radio.ended()  and
   radio.err(code); everything it does is also written with console.log("RADIO ...").
   Browsers refuse to START unmuted video without a click, but always allow muted autoplay, so every track starts muted and
   is unmuted the moment it is really playing (the same way the Media Player addon does it). Host this file on GitHub Pages:
   YouTube only plays embedded videos for pages that have a real web address. */
var player = null, ready = false, pending = null, vol = 0, cur = "", durTimer = null, retryTimer = null;

function log(msg) { try { console.log("RADIO " + msg); } catch (e) {} }
function tell(name, arg) {
  try { if (window.radio && window.radio[name]) window.radio[name](arg); } catch (e) {}
}
window.onerror = function (msg, src, line) { log("page error: " + msg + " (line " + line + ")"); };

function applyVol() {
  if (!ready) return;
  try {
    if (vol > 0 && player.isMuted()) player.unMute();
    player.setVolume(vol);
  } catch (e) { log("volume error: " + e); }
}

function onYouTubeIframeAPIReady() {
  log("iframe api loaded");
  var vars = { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0, modestbranding: 1,
               enablejsapi: 1, muted: 1 };
  if (location.origin && location.origin !== "null") vars.origin = location.origin;
  player = new YT.Player("p", {
    width: "100%", height: "100%",
    host: "https://www.youtube-nocookie.com",
    playerVars: vars,
    events: {
      onReady: function () {
        ready = true;
        log("player ready");
        player.setVolume(vol);
        if (pending) setTrack(pending.id, pending.t);
      },
      onStateChange: function (e) {
        log("state " + e.data + " (" + cur + ")");
        if (e.data === YT.PlayerState.PLAYING) {
          applyVol();
          clearTimeout(durTimer);
          durTimer = setTimeout(function () {
            var live = false;
            try { live = !!(player.getVideoData && player.getVideoData().isLive); } catch (x) {}
            var d = Math.round(player.getDuration() || 0);
            log("duration " + (live ? "live" : d));
            tell("dur", live ? 0 : d);
          }, 900);
        } else if (e.data === YT.PlayerState.ENDED) {
          tell("ended", cur);
        }
      },
      onError: function (e) { log("error " + e.data); tell("err", e.data); }
    }
  });
}

function setTrack(id, t) {
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
  if (!ready) { pending = { id: id, t: t }; return; }
  pending = null;
  cur = id;
  log("load " + id + " at " + (t | 0) + "s");
  try { player.mute(); } catch (e) {}                 // start muted, it is unmuted when it plays
  player.loadVideoById({ videoId: id, startSeconds: Math.max(0, t | 0) });
  clearTimeout(retryTimer);
  retryTimer = setTimeout(function () {                // still not playing after a few seconds: ask it to play
    try {
      var s = player.getPlayerState();
      if (s !== 1 && s !== 3) { log("not playing (state " + s + "), asking it to play"); player.playVideo(); }
    } catch (e) {}
  }, 4000);
}

function stopTrack() {
  pending = null;
  cur = "";
  clearTimeout(durTimer);
  clearTimeout(retryTimer);
  if (ready) { try { player.stopVideo(); } catch (e) {} }
}

function setVol(v) {
  vol = Math.max(0, Math.min(100, v | 0));
  applyVol();
}

function report() {
  if (!ready) { log("status: player not ready (api loaded: " + !!(window.YT && YT.Player) + ")"); return; }
  try {
    log("status: state=" + player.getPlayerState() + " muted=" + player.isMuted() + " volume=" + player.getVolume() +
        " time=" + Math.round(player.getCurrentTime()) + " video=" + cur + " wantedVolume=" + vol);
  } catch (e) { log("status error: " + e); }
}

var s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
s.onerror = function () { log("FAILED to load the YouTube iframe api (no internet or blocked)"); };
document.head.appendChild(s);
log("page loaded");
</script>
</body>
</html>
