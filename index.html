<!doctype html>
<html><head><meta charset="utf-8"><title>SoullessRP</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#d0f;overflow:hidden;font-family:Arial,sans-serif}
#msg{position:fixed;top:40%;left:0;width:100%;text-align:center;color:#fff;font-size:42px}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:#000 url("bg.jpg") center center no-repeat;-webkit-background-size:cover;background-size:cover}
#tick{position:fixed;right:0;bottom:0;width:2px;height:2px;background:#000;opacity:.5}
</style></head>
<body><div id="msg">Loading page works, but the picture did not load</div><div id="bg"></div><div id="tick"></div>
<script>
// The game's loading browser only repaints a page when something changes, so a tiny corner dot keeps changing.
var t=document.getElementById('tick'),n=0;
setInterval(function(){n=(n+1)%2;t.style.opacity=n?'0.5':'0.6';},100);
</script>
</body></html>
